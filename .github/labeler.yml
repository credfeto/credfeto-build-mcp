--- # Configures the GitHub Pull Request Labeler - applies labels to pull requests based on changed files.
# Generated by credfeto-dotnet-repo-tools
".NET update":
  - any: ['src/global.json']
"C#":
  - any: ['./**/*.cs', './**/*.csproj']
"C# Project":
  - any: ['./**/*.csproj']
"C# Solution":
  - any: ['./**/*.sln', './**/*.slnx']
"Change Log":
  - any: ['CHANGELOG.md']
"Config Change":
  - any: ['src/**/*.json', '!src/global.json']
"credfeto-build-core":
  - any: ['src/Credfeto.Build.Core/**/*']
"credfeto-build-core-tests":
  - any: ['src/Credfeto.Build.Core.Tests/**/*']
"credfeto-build-dotnet-server":
  - any: ['src/Credfeto.Build.Dotnet.Server/**/*']
"credfeto-build-dotnet-server-tests":
  - any: ['src/Credfeto.Build.Dotnet.Server.Tests/**/*']
"dotnet":
  - any: ['src/**/*.csproj']
"Editorconfig":
  - any: ['.editorconfig']
"github-actions":
  - any: ['.github/actions/*.yml', '.github/workflows/*.yml']
"Markdown":
  - any: ['./**/*.md']
"Migration Script":
  - any: ['tools/MigrationScripts/**/*']
"npm":
  - any: ['./**/package-lock.json', './**/package.json']
"Powershell":
  - any: ['./**/*.ps1', './**/*.psm1']
"Read Me":
  - any: ['README.md']
"Setup":
  - any: ['SETUP.md']
"Solidity":
  - any: ['./**/*.sol']
"SQL":
  - any: ['./**/*.sql', 'db/**/*']
"Static Code Analysis Rules":
  - any: ['.globalconfig', 'src/CodeAnalysis.ruleset']
"Unit Tests":
  - any: ['src/*.Tests.*/**/*', 'src/*.Tests.Integration.*/**/*', 'src/*.Tests.Integration/**/*', 'src/*.Tests/**/*']
